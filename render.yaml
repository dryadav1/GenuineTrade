services:
  - type: web
    name: genuine-trade-api
    env: node
    plan: starter
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_TEMPLATE_ID
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PROFESSIONAL_MONTHLY
        sync: false
      - key: STRIPE_PRICE_PROFESSIONAL_ANNUAL
        sync: false
      - key: STRIPE_PRICE_ENTERPRISE_MONTHLY
        sync: false
      - key: STRIPE_PRICE_ENTERPRISE_ANNUAL
        sync: false
      - key: STRIPE_CHECKOUT_SUCCESS_URL
        sync: false
      - key: STRIPE_CHECKOUT_CANCEL_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_PLAN_PROFESSIONAL_MONTHLY
        sync: false
      - key: RAZORPAY_PLAN_PROFESSIONAL_ANNUAL
        sync: false
      - key: RAZORPAY_PLAN_ENTERPRISE_MONTHLY
        sync: false
      - key: RAZORPAY_PLAN_ENTERPRISE_ANNUAL
        sync: false
      - key: DEFAULT_BASE_CURRENCY
        value: USD
      - key: MONGODB_SERVER_SELECTION_TIMEOUT_MS
        value: "5000"
      - key: CACHE_DRIVER
        value: memory
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "250"
      - key: AUTH_RATE_LIMIT_MAX
        value: "30"
      - key: JSON_BODY_LIMIT
        value: 15mb
      - key: KYC_DOCUMENT_MAX_SIZE_BYTES
        value: "5242880"
